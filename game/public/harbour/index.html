<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Two Harbors — harbour</title>
    <link rel="stylesheet" href="/harbour/style.css" />
  </head>
  <body>
    <header class="bar">
      <p class="badge">BASE · 3D HARBOUR · PAPER · SIMULATED</p>
      <h1 id="place">North port</h1>
      <p id="status">Loading 3D harbour…</p>
    </header>
    <aside class="sheet" id="sheet">
      <p id="cash">Cash $0</p>
      <p id="plot-line">Tap land to inspect it</p>
    </aside>
    <canvas id="c"></canvas>
    <div id="taxi-map" class="taxi-map" hidden>
      <p class="taxi-map-badge">PAPER · SIMULATED</p>
      <p class="taxi-map-hint">Tap a rough point. Ride stays on paved. Dirt forbidden.</p>
      <canvas id="taxi-map-canvas" width="320" height="220"></canvas>
      <button type="button" id="taxi-map-close">Close</button>
    </div>
    <div id="catalog-picker" hidden>
      <p class="catalog-badge">PAPER · SIMULATED</p>
      <p class="catalog-hint">Pick a building, then tap your leased land.</p>
      <div class="catalog-grid"></div>
      <button type="button" id="catalog-cancel">Cancel</button>
    </div>
    <nav class="dock">
      <button type="button" id="btn-lease" disabled>Lease</button>
      <button type="button" id="btn-develop" disabled>Develop</button>
      <button type="button" id="btn-ferry" disabled>Ferry</button>
      <button type="button" id="btn-taxi" title="PAPER · SIMULATED">Taxi</button>
      <a class="ghost" href="/market/">Market</a>
    </nav>
    <script>
      (function () {
        var status = document.getElementById("status");
        var cash = document.getElementById("cash");
        function stillBooting() {
          if (!status) return false;
          var t = status.textContent || "";
          return t.indexOf("Loading") === 0 || t.indexOf("BOOT FAIL") === 0;
        }
        function fail(msg) {
          if (status && stillBooting()) status.textContent = "BOOT FAIL: " + msg;
        }
        window.addEventListener(
          "error",
          function (e) {
            var msg = (e && e.message) || "";
            if (!msg && e && e.filename) msg = "load " + e.filename;
            if (!msg && e && e.target && e.target.src) msg = "load " + e.target.src;
            if (msg) fail(msg);
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          var r = e.reason;
          fail(r && r.message ? r.message : String(r));
        });
        // Classic fetch: cash must update even if the three.js module never runs.
        fetch("/api/map")
          .then(function (r) {
            if (!r.ok) throw new Error("map " + r.status);
            return r.json();
          })
          .then(function (d) {
            if (cash && d && d.visitor) {
              cash.textContent =
                "Cash $" +
                Number(d.visitor.cash).toLocaleString("en-US", { maximumFractionDigits: 0 });
            }
          })
          .catch(function (e) {
            fail("map " + (e && e.message ? e.message : e));
          });
      })();
    </script>
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
    <script type="module" src="/harbour/main.js"></script>
  </body>
</html>
