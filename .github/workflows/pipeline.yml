name: Automated Pipeline

on:
  schedule:
    # Run every hour — stays within free tier (720 min/month)
    - cron: '0 * * * *'
  workflow_dispatch:  # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline
        id: pipeline
        run: |
          chmod +x scripts/run_pipeline.sh
          scripts/run_pipeline.sh 2>&1 | tee pipeline_output.txt

      - name: Commit and push updated data
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage dashboard exports and reports (data/ is gitignored — do not add)
          git add dashboard/data/ reports/

          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Automated pipeline run: $TIMESTAMP

          Triggered by: ${{ github.event_name }}"
            git push origin main
          fi

      - name: Commit partial data on partial failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit reports (not potentially corrupt data)
          git add reports/pipeline_report.json || true

          if git diff --cached --quiet; then
            echo "No report to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "Pipeline FAILED: $TIMESTAMP — see report for details

          Triggered by: ${{ github.event_name }}"
            git push origin main
          fi

      - name: Pipeline status summary
        if: always()
        run: |
          echo "## Pipeline Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** ${{ steps.pipeline.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Time:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/pipeline_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/pipeline_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/evaluation_summary.json ]; then
            echo "### Evaluation Summary" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/evaluation_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
